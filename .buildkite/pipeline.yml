agents:
  queue: "default-queue"

steps:
  - label: ":swift: Lint"
    key: "lint"
    command: "swiftlint --strict"

  - label: ":metal: Test (macOS, {{matrix.configuration}})"
    key: "test"
    concurrency: 1
    concurrency_group: "metalsprocketspbr/gpu-tests"
    env:
      MTL_DEBUG_LAYER: "1"
    matrix:
      setup:
        configuration:
          - "debug"
          - "release"
    command:
      - "swift build -c {{matrix.configuration}} --disable-sandbox"
      - "swift test -c {{matrix.configuration}} -Xswiftc -enable-testing --disable-sandbox"

